#  HyprNotch keybinds — append to your hyprland.conf
#  Replace @RAIZ@ with ~/.config/quickshell/hyprnotch
#
#  NOTE for k4 Lua-fork users (hyprland.lua instead of hyprland.conf):
#  ./install.sh detects that and writes ~/.config/hypr/config/hyprnotch.lua
#  for you — you never need this file.
#
#  NOTE for everyone: Settings → Keybinds edits ALL of these chords live
#  (and rewrites hyprnotch.lua on the k4 fork). This file is just the
#  static fallback.

#  The IPC call. `quickshell ipc` is the subcommand — without it the bind
#  fires nothing and the keypress falls through to the terminal.
$notch = quickshell ipc -p @RAIZ@/shell.qml call notch

#  Auto-start
exec-once = @RAIZ@/start.sh

#  Popups — Super+Space opens the launcher
bind = SUPER, SPACE, exec, $notch launcher
bind = SUPER, C, exec, $notch controlCenter
bind = SUPER, K, exec, $notch calendar
bind = SUPER, N, exec, $notch notifications
bind = SUPER, W, exec, $notch weather
bind = SUPER, T, exec, $notch stats
bind = SUPER, G, exec, $notch wallpaper
bind = SUPER, E, exec, $notch power
bind = SUPER, I, exec, $notch about
bind = SUPER, O, exec, $notch plugins
bind = SUPER, S, exec, $notch settings

#  Toggles
bind = SUPER, B, exec, $notch dnd
bind = SUPER, P, exec, $notch podman

#  r24 — capture, clipboard, new notch panels
bind = SUPER, V, exec, $notch clipboard       # clipboard history (Win+V)
bind = , PRINT, exec, $notch screenshot       # screenshot (region, toast feedback)
bind = SHIFT, PRINT, exec, $notch record      # wf-recorder start/stop
bind = SUPER, U, exec, $notch containers      # podman containers in the notch
bind = SUPER, Y, exec, $notch agent           # AI agent status / usage
bind = SUPER, A, exec, $notch features        # quick toggles (per-feature switches)

#  Hardware keys (the HUD shows INSIDE the pill automatically)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindl  = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

#  Dock layer rules — compositor blur under the frosted bar (r24: the
#  Liquid Glass shader was removed; the bar is frosted blur now) and no
#  compositor animation (the dock animates itself).
layerrule = blur, hyprnotch-dock
layerrule = ignorealpha 0.2, hyprnotch-dock
layerrule = noanim, hyprnotch-dock
