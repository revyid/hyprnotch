#  HyprNotch keybinds — append to your hyprland.conf
#  Replace @RAIZ@ with ~/.config/quickshell/hyprnotch

$notch = quickshell -p @RAIZ@/shell.qml call notch

#  Auto-start
exec-once = @RAIZ@/start.sh

#  ── SUPER / Win key opens the launcher ────────────────────────────
#  bindr fires on RELEASE: tap the Super key alone and the launcher
#  springs out of the pill (holding Super for a chord still works).
bindr = SUPER, SUPER_L, exec, $notch launcher

#  Popups
bind = SUPER, C, exec, $notch controlCenter
bind = SUPER, K, exec, $notch calendar
bind = SUPER, N, exec, $notch notifications
bind = SUPER, D, exec, $notch launcher
bind = SUPER, W, exec, $notch weather
bind = SUPER, T, exec, $notch stats
bind = SUPER, G, exec, $notch wallpaper
bind = SUPER, E, exec, $notch power
bind = SUPER, I, exec, $notch about
bind = SUPER, S, exec, $notch settings

#  Toggles
bind = SUPER, B, exec, $notch dnd
bind = SUPER, L, exec, $notch nightLight
bind = SUPER, P, exec, $notch podman

#  Hardware keys (the HUD shows INSIDE the pill automatically)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindl  = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
